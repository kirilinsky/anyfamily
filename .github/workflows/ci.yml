name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

env:
  # tsdown declares engines ^22.18.0 || >=24.11.0, so anything that builds has
  # to run here. The runtime matrix below deliberately does not build.
  BUILD_NODE: 24

jobs:
  # Does the shipped code run on every Node the packages claim to support?
  # The seven leaf packages test their own src/, so no build is involved and
  # the build tool's own floor is irrelevant.
  runtime:
    name: runtime (node ${{ matrix.node }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # Only Node 23+ carries Intl.DurationFormat. anylong's suite skips its
        # formatting tests where the API is missing and asserts the
        # `anylong.supported` flag instead, so 20 and 22 stay green and still
        # prove the package degrades rather than crashes.
        node: [20, 22, 24]
    steps:
      - uses: actions/checkout@v5

      - uses: pnpm/action-setup@v4
        with:
          version: 10.32.1

      - uses: actions/setup-node@v5
        with:
          node-version: ${{ matrix.node }}
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: test packages
        run: >
          pnpm --filter "./packages/*"
          --filter "!./packages/anyfamily"
          --filter "!./packages/anyfamily-react"
          test

  # Does it build, type-check and package correctly? Once, on a modern Node.
  # The meta packages live here because they import their siblings by package
  # name, which resolves to each sibling's dist/ — so they cannot be tested
  # before the leaves are built.
  packaging:
    name: build, types & packaging
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: pnpm/action-setup@v4
        with:
          version: 10.32.1

      - uses: actions/setup-node@v5
        with:
          node-version: ${{ env.BUILD_NODE }}
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      # pnpm runs recursive scripts in dependency order, so the leaves go first
      # and the metas find their dist/ when their turn comes.
      - name: build
        run: pnpm --filter "./packages/*" build

      # No --if-present: all ten packages declare `typecheck`, and a package
      # that quietly stops declaring it should fail here rather than be skipped.
      # That is exactly how the metas went unchecked until 2026-08-09.
      - name: typecheck
        run: pnpm --filter "./packages/*" typecheck

      - name: test
        run: pnpm --filter "./packages/*" test

      # Only the metas run knip: they are the packages where an unused
      # dependency or a dropped re-export can hide, since nothing but the
      # re-export list itself says what they are supposed to contain.
      - name: knip
        run: pnpm --filter "./packages/*" --if-present knip

      # Validates the published shape — exports map, types resolution, files.
      # More important now than per-repo: changesets publishes automatically, so
      # a broken exports map would ship without anyone looking at it.
      - name: publint
        run: pnpm --filter "./packages/*" publint

  site:
    name: landing site
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: pnpm/action-setup@v4
        with:
          version: 10.32.1

      - uses: actions/setup-node@v5
        with:
          node-version: ${{ env.BUILD_NODE }}
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - run: pnpm lint

      # Deliberately the same two commands Vercel runs, with no extra build
      # step: the site resolves the workspace packages through their dist/, and
      # `prebuild` is what builds them. Keeping this identical means a deploy
      # can't break in a way CI passed over.
      - run: pnpm build
